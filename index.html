<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>RSVP Speed Reader</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #090909;
      color: white;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    /* ========================================
       APP LAYOUT
       ======================================== */

    .app-shell {
      min-height: 100vh;
      display: flex;
    }

    /* ========================================
       SIDEBAR
       ======================================== */

    .sidebar {
      width: 280px;
      flex-shrink: 0;

      background: #111111;

      border-right: 1px solid #242424;

      display: flex;
      flex-direction: column;

      transition:
        width 0.2s ease,
        transform 0.2s ease;
    }

    .sidebar.collapsed {
      width: 0;
      overflow: hidden;
      border-right: 0;
    }

    .sidebar-header {
      padding: 14px;

      border-bottom: 1px solid #242424;
    }

    .new-text-button {
      width: 100%;

      border: 1px solid #333;
      border-radius: 10px;

      background: #1d1d1d;
      color: white;

      padding: 12px 14px;

      cursor: pointer;

      text-align: left;
      font-weight: 600;
    }

    .new-text-button:hover {
      background: #292929;
    }

    .sidebar-section-title {
      color: #888;

      font-size: 12px;
      font-weight: 600;

      text-transform: uppercase;
      letter-spacing: 0.07em;

      padding: 18px 16px 8px;
    }

    .saved-list {
      flex: 1;

      overflow-y: auto;

      padding: 4px 8px 14px;
    }

    .saved-empty {
      color: #666;

      font-size: 13px;
      line-height: 1.5;

      padding: 12px 8px;
    }

    .saved-item {
      position: relative;

      display: flex;
      align-items: center;

      width: 100%;

      border-radius: 8px;

      margin-bottom: 3px;

      background: transparent;
    }

    .saved-item.active {
      background: #242424;
    }

    .saved-title-button {
      flex: 1;
      min-width: 0;

      border: 0;

      background: transparent;
      color: #e9e9e9;

      cursor: pointer;

      text-align: left;

      padding: 10px 8px 10px 10px;

      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .saved-title-button:hover {
      background: #1c1c1c;
      border-radius: 8px;
    }

    .saved-item.active .saved-title-button:hover {
      background: #2a2a2a;
    }

    .saved-menu-button {
      flex-shrink: 0;

      width: 32px;
      height: 32px;

      border: 0;
      border-radius: 6px;

      background: transparent;
      color: #999;

      cursor: pointer;

      opacity: 0;
    }

    .saved-item:hover .saved-menu-button,
    .saved-item.active .saved-menu-button {
      opacity: 1;
    }

    .saved-menu-button:hover {
      background: #333;
      color: white;
    }

    /* ========================================
       CONTEXT MENU
       ======================================== */

    .context-menu {
      position: fixed;

      z-index: 100;

      width: 150px;

      padding: 6px;

      border: 1px solid #333;
      border-radius: 10px;

      background: #1c1c1c;

      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);

      display: none;
    }

    .context-menu.open {
      display: block;
    }

    .context-menu button {
      width: 100%;

      border: 0;
      border-radius: 6px;

      background: transparent;
      color: white;

      padding: 9px 10px;

      cursor: pointer;
      text-align: left;
    }

    .context-menu button:hover {
      background: #303030;
    }

    .context-menu .delete-option {
      color: #ff7979;
    }

    /* ========================================
       MAIN
       ======================================== */

    .main-area {
      flex: 1;
      min-width: 0;

      position: relative;

      padding: 32px 24px 60px;

      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 850px;
    }

    .top-bar {
      display: flex;
      align-items: center;

      gap: 12px;

      margin-bottom: 20px;
    }

    .sidebar-toggle {
      flex-shrink: 0;

      width: 42px;
      height: 42px;

      border: 1px solid #333;
      border-radius: 9px;

      background: #171717;
      color: white;

      cursor: pointer;

      font-size: 20px;
    }

    .sidebar-toggle:hover {
      background: #242424;
    }

    h1 {
      flex: 1;

      margin: 0;

      text-align: center;

      font-size: 28px;
    }

    .save-button {
      flex-shrink: 0;

      border: 1px solid #3b3b3b;
      border-radius: 8px;

      background: #1b1b1b;
      color: white;

      padding: 10px 14px;

      cursor: pointer;
      font-weight: 600;
    }

    .save-button:hover {
      background: #282828;
    }

    /* ========================================
       INPUT
       ======================================== */

    .controls {
      display: grid;

      gap: 14px;

      margin-bottom: 24px;
    }

    textarea {
      width: 100%;
      min-height: 180px;

      resize: vertical;

      background: #161616;
      color: white;

      border: 1px solid #333;
      border-radius: 10px;

      padding: 16px;

      font-size: 16px;
      line-height: 1.5;

      outline: none;
    }

    textarea:focus {
      border-color: #666;
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;

      gap: 10px;

      align-items: center;
    }

    .wpm-input {
      width: 105px;

      background: #161616;
      color: white;

      border: 1px solid #333;
      border-radius: 8px;

      padding: 10px 12px;

      outline: none;
    }

    .wpm-input:focus {
      border-color: #777;
    }

    .control-button {
      border: 0;
      border-radius: 8px;

      padding: 11px 18px;

      cursor: pointer;

      font-weight: 600;

      background: white;
      color: black;
    }

    .control-button:hover {
      opacity: 0.88;
    }

    .control-button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* ========================================
       READER
       ======================================== */

    .reader {
      position: relative;

      height: 250px;

      background: #0d0d0d;

      border: 1px solid #222;
      border-radius: 14px;

      overflow: hidden;
    }

    .reader::before,
    .reader::after {
      content: "";

      position: absolute;

      left: 50%;

      width: 2px;
      height: 22px;

      background: #383838;

      transform: translateX(-50%);
    }

    .reader::before {
      top: 0;
    }

    .reader::after {
      bottom: 0;
    }

    .word {
      position: absolute;

      left: 50%;
      top: 50%;

      display: inline-flex;
      align-items: baseline;

      white-space: pre;

      font-size: clamp(36px, 8vw, 76px);
      font-weight: 600;
      line-height: 1;

      transform:
        translate(
          var(--pivot-shift, 0px),
          -50%
        );
    }

    .before,
    .pivot,
    .after {
      display: inline;
      white-space: pre;
    }

    .pivot {
      color: #ff4141;
    }

    /* ========================================
       PROGRESS
       ======================================== */

    .progress-area {
      margin-top: 18px;
    }

    .progress-slider {
      --progress: 0%;

      width: 100%;
      height: 18px;

      margin: 0;
      padding: 0;

      appearance: none;
      -webkit-appearance: none;

      background: transparent;

      cursor: pointer;
    }

    .progress-slider::-webkit-slider-runnable-track {
      height: 8px;

      border-radius: 999px;

      background:
        linear-gradient(
          to right,
          white 0%,
          white var(--progress),
          #222 var(--progress),
          #222 100%
        );
    }

    .progress-slider::-webkit-slider-thumb {
      -webkit-appearance: none;

      width: 18px;
      height: 18px;

      margin-top: -5px;

      border-radius: 50%;

      border: 2px solid white;

      background: #090909;

      cursor: grab;
    }

    .progress-slider::-moz-range-track {
      height: 8px;

      border-radius: 999px;

      background: #222;
    }

    .progress-slider::-moz-range-progress {
      height: 8px;

      border-radius: 999px;

      background: white;
    }

    .progress-slider::-moz-range-thumb {
      width: 16px;
      height: 16px;

      border: 2px solid white;
      border-radius: 50%;

      background: #090909;

      cursor: grab;
    }

    .progress-slider:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .progress-info {
      display: flex;

      justify-content: space-between;
      align-items: flex-start;

      margin-top: 5px;

      font-size: 14px;
      color: #888;
    }

    .progress-right {
      display: flex;
      flex-direction: column;

      align-items: flex-end;

      gap: 5px;
    }

    .time-remaining {
      font-size: 12px;
      color: #666;
    }

    .hint {
      text-align: center;

      color: #666;

      font-size: 13px;

      margin-top: 15px;
    }

    /* ========================================
       TOAST
       ======================================== */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 24px;

      z-index: 200;

      transform: translateX(-50%) translateY(20px);

      background: #242424;
      color: white;

      border: 1px solid #3a3a3a;
      border-radius: 9px;

      padding: 10px 14px;

      font-size: 14px;

      opacity: 0;
      pointer-events: none;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    .toast.show {
      opacity: 1;

      transform: translateX(-50%) translateY(0);
    }

    /* ========================================
       MOBILE
       ======================================== */

    @media (max-width: 760px) {
      .sidebar {
        position: fixed;

        left: 0;
        top: 0;
        bottom: 0;

        z-index: 50;

        width: 280px;

        box-shadow: 20px 0 40px rgba(0, 0, 0, 0.45);
      }

      .sidebar.collapsed {
        width: 280px;

        transform: translateX(-100%);

        border-right: 1px solid #242424;
      }

      .main-area {
        padding:
          18px
          14px
          50px;
      }

      h1 {
        font-size: 21px;
      }

      .save-button {
        padding: 9px 11px;
      }

      .reader {
        height: 200px;
      }
    }
  </style>
</head>

<body>

  <div class="app-shell">

    <!-- ========================================
         SIDEBAR
         ======================================== -->

    <aside
      class="sidebar"
      id="sidebar"
    >

      <div class="sidebar-header">

        <button
          class="new-text-button"
          id="newTextButton"
        >
          ＋ New text
        </button>

      </div>


      <div class="sidebar-section-title">
        Saved texts
      </div>


      <div
        class="saved-list"
        id="savedList"
      ></div>

    </aside>


    <!-- ========================================
         MAIN
         ======================================== -->

    <main class="main-area">

      <div class="app">

        <div class="top-bar">

          <button
            class="sidebar-toggle"
            id="sidebarToggle"
            aria-label="Toggle saved texts sidebar"
            title="Toggle saved texts"
          >
            ☰
          </button>


          <h1>
            RSVP Speed Reader
          </h1>


          <button
            class="save-button"
            id="saveTextButton"
          >
            Save
          </button>

        </div>


        <!-- ========================================
             TEXT / CONTROLS
             ======================================== -->

        <section class="controls">

          <textarea
            id="textInput"
            placeholder="Paste the text you want to speed read here..."
          ></textarea>


          <div class="control-row">

            <label for="wpmInput">
              Speed:
            </label>


            <input
              id="wpmInput"
              class="wpm-input"
              type="number"
              value="300"
              min="1"
              max="2500"
              step="1"
              inputmode="numeric"
            />


            <span>
              WPM
            </span>


            <button
              class="control-button"
              id="startButton"
            >
              Start
            </button>


            <button
              class="control-button"
              id="pauseButton"
              disabled
            >
              Pause
            </button>


            <button
              class="control-button"
              id="restartButton"
              disabled
            >
              Restart
            </button>

          </div>

        </section>


        <!-- ========================================
             READER
             ======================================== -->

        <section class="reader">

          <div
            class="word"
            id="word"
          >
            <span
              class="before"
              id="before"
            ></span><span
              class="pivot"
              id="pivot"
            >R</span><span
              class="after"
              id="after"
            >eady</span>
          </div>

        </section>


        <!-- ========================================
             PROGRESS
             ======================================== -->

        <section class="progress-area">

          <input
            id="progressSlider"
            class="progress-slider"
            type="range"
            min="0"
            max="0"
            value="0"
            step="1"
            aria-label="Reading progress"
            disabled
          />


          <div class="progress-info">

            <span id="wordCounter">
              0 / 0
            </span>


            <div class="progress-right">

              <span id="percentage">
                0%
              </span>


              <span
                class="time-remaining"
                id="timeRemaining"
              >
                Time remaining: 0:00
              </span>

            </div>

          </div>

        </section>


        <div class="hint">
          Press Space to pause/resume
        </div>

      </div>

    </main>

  </div>


  <!-- ========================================
       SAVED TEXT MENU
       ======================================== -->

  <div
    class="context-menu"
    id="contextMenu"
  >

    <button id="renameSavedButton">
      Rename
    </button>

    <button
      class="delete-option"
      id="deleteSavedButton"
    >
      Delete
    </button>

  </div>


  <div
    class="toast"
    id="toast"
  ></div>


  <script>

    /* ========================================
       ELEMENTS
       ======================================== */

    const sidebar =
      document.getElementById("sidebar");

    const sidebarToggle =
      document.getElementById("sidebarToggle");

    const newTextButton =
      document.getElementById("newTextButton");

    const saveTextButton =
      document.getElementById("saveTextButton");

    const savedList =
      document.getElementById("savedList");

    const contextMenu =
      document.getElementById("contextMenu");

    const renameSavedButton =
      document.getElementById("renameSavedButton");

    const deleteSavedButton =
      document.getElementById("deleteSavedButton");

    const toast =
      document.getElementById("toast");


    const textInput =
      document.getElementById("textInput");

    const wpmInput =
      document.getElementById("wpmInput");

    const startButton =
      document.getElementById("startButton");

    const pauseButton =
      document.getElementById("pauseButton");

    const restartButton =
      document.getElementById("restartButton");

    const wordElement =
      document.getElementById("word");

    const beforeElement =
      document.getElementById("before");

    const pivotElement =
      document.getElementById("pivot");

    const afterElement =
      document.getElementById("after");

    const progressSlider =
      document.getElementById("progressSlider");

    const wordCounter =
      document.getElementById("wordCounter");

    const percentage =
      document.getElementById("percentage");

    const timeRemaining =
      document.getElementById("timeRemaining");


    /* ========================================
       STATE
       ======================================== */

    const STORAGE_KEY =
      "rsvp_saved_texts_v1";


    let savedTexts = [];

    let activeSavedId = null;

    let contextMenuId = null;


    let words = [];

    let currentIndex = 0;

    let timer = null;

    let running = false;

    let paused = false;


    /* ========================================
       STORAGE
       ======================================== */

    function loadSavedTextsFromStorage() {

      try {

        const raw =
          localStorage.getItem(
            STORAGE_KEY
          );


        if (!raw) {

          savedTexts = [];

          return;

        }


        const parsed =
          JSON.parse(raw);


        savedTexts =
          Array.isArray(parsed)
            ? parsed
            : [];

      } catch (error) {

        console.error(
          "Could not load saved texts:",
          error
        );

        savedTexts = [];

      }

    }


    function persistSavedTexts() {

      try {

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(savedTexts)
        );

      } catch (error) {

        console.error(
          "Could not save texts:",
          error
        );


        showToast(
          "Could not save to browser storage."
        );

      }

    }


    /* ========================================
       TITLE GENERATION
       ======================================== */

    function generateTitle(text) {

      const clean =
        text
          .replace(/\s+/g, " ")
          .trim();


      if (!clean) {

        return "Untitled text";

      }


      const words =
        clean.split(" ");


      let title =
        words
          .slice(0, 7)
          .join(" ");


      if (title.length > 45) {

        title =
          title.slice(0, 45);

      }


      if (
        clean.length >
        title.length
      ) {

        title += "…";

      }


      return title;

    }


    /* ========================================
       SAVE CURRENT TEXT
       ======================================== */

    function saveCurrentText() {

      const text =
        textInput.value.trim();


      if (!text) {

        showToast(
          "Paste some text before saving."
        );

        return;

      }


      validateWpmInput();


      /*
       * If this text came from an existing
       * saved item, update that item.
       */

      if (activeSavedId) {

        const existing =
          savedTexts.find(
            item =>
              item.id === activeSavedId
          );


        if (existing) {

          existing.text =
            textInput.value;

          existing.wpm =
            getWpm();

          existing.updatedAt =
            Date.now();


          persistSavedTexts();

          renderSavedTexts();


          showToast(
            "Saved changes."
          );

          return;

        }

      }


      /*
       * Otherwise create a new saved text.
       */

      const item = {

        id:
          createId(),

        title:
          generateTitle(text),

        text:
          textInput.value,

        wpm:
          getWpm(),

        createdAt:
          Date.now(),

        updatedAt:
          Date.now()

      };


      savedTexts.unshift(
        item
      );


      activeSavedId =
        item.id;


      persistSavedTexts();

      renderSavedTexts();


      showToast(
        "Text saved."
      );

    }


    function createId() {

      if (
        window.crypto &&
        crypto.randomUUID
      ) {

        return crypto.randomUUID();

      }


      return (
        Date.now().toString(36) +
        Math.random()
          .toString(36)
          .slice(2)
      );

    }


    /* ========================================
       RENDER SAVED TEXTS
       ======================================== */

    function renderSavedTexts() {

      savedList.innerHTML = "";


      if (
        savedTexts.length === 0
      ) {

        const empty =
          document.createElement(
            "div"
          );


        empty.className =
          "saved-empty";


        empty.textContent =
          "Your saved texts will appear here.";


        savedList.appendChild(
          empty
        );


        return;

      }


      /*
       * Newest modified items first.
       */

      const sorted =
        [...savedTexts].sort(
          (a, b) =>
            (b.updatedAt || 0) -
            (a.updatedAt || 0)
        );


      sorted.forEach(item => {

        const row =
          document.createElement(
            "div"
          );


        row.className =
          "saved-item";


        if (
          item.id === activeSavedId
        ) {

          row.classList.add(
            "active"
          );

        }


        const titleButton =
          document.createElement(
            "button"
          );


        titleButton.className =
          "saved-title-button";


        titleButton.textContent =
          item.title;


        titleButton.title =
          item.title;


        titleButton.addEventListener(
          "click",
          () => {

            loadSavedText(
              item.id
            );

          }
        );


        const menuButton =
          document.createElement(
            "button"
          );


        menuButton.className =
          "saved-menu-button";


        menuButton.textContent =
          "⋯";


        menuButton.setAttribute(
          "aria-label",
          `Options for ${item.title}`
        );


        menuButton.addEventListener(
          "click",
          event => {

            event.stopPropagation();


            openContextMenu(
              item.id,
              menuButton
            );

          }
        );


        row.append(
          titleButton,
          menuButton
        );


        savedList.appendChild(
          row
        );

      });

    }


    /* ========================================
       LOAD SAVED TEXT
       ======================================== */

    function loadSavedText(id) {

      const item =
        savedTexts.find(
          saved =>
            saved.id === id
        );


      if (!item) {
        return;
      }


      activeSavedId =
        item.id;


      textInput.value =
        item.text;


      wpmInput.value =
        item.wpm || 300;


      resetReader();


      renderSavedTexts();


      /*
       * On small screens, close sidebar
       * after choosing an item.
       */

      if (
        window.innerWidth <= 760
      ) {

        sidebar.classList.add(
          "collapsed"
        );

      }

    }


    /* ========================================
       NEW TEXT
       ======================================== */

    function newText() {

      clearTimeout(timer);


      activeSavedId = null;


      textInput.value = "";

      wpmInput.value = 300;


      resetReader();

      renderSavedTexts();


      textInput.focus();


      if (
        window.innerWidth <= 760
      ) {

        sidebar.classList.add(
          "collapsed"
        );

      }

    }


    /* ========================================
       RENAME / DELETE
       ======================================== */

    function openContextMenu(
      id,
      button
    ) {

      contextMenuId =
        id;


      const rect =
        button.getBoundingClientRect();


      contextMenu.style.left =
        `${Math.max(
          8,
          rect.right - 150
        )}px`;


      contextMenu.style.top =
        `${rect.bottom + 4}px`;


      contextMenu.classList.add(
        "open"
      );

    }


    function closeContextMenu() {

      contextMenu.classList.remove(
        "open"
      );


      contextMenuId = null;

    }


    function renameSavedText() {

      if (!contextMenuId) {
        return;
      }


      const item =
        savedTexts.find(
          saved =>
            saved.id ===
            contextMenuId
        );


      if (!item) {
        return;
      }


      const newTitle =
        prompt(
          "Rename saved text:",
          item.title
        );


      if (newTitle === null) {

        closeContextMenu();

        return;

      }


      const clean =
        newTitle.trim();


      if (!clean) {

        closeContextMenu();

        return;

      }


      item.title =
        clean;


      item.updatedAt =
        Date.now();


      persistSavedTexts();

      renderSavedTexts();

      closeContextMenu();

    }


    function deleteSavedText() {

      if (!contextMenuId) {
        return;
      }


      const item =
        savedTexts.find(
          saved =>
            saved.id ===
            contextMenuId
        );


      if (!item) {
        return;
      }


      const confirmed =
        confirm(
          `Delete "${item.title}"?`
        );


      if (!confirmed) {

        closeContextMenu();

        return;

      }


      savedTexts =
        savedTexts.filter(
          saved =>
            saved.id !== item.id
        );


      if (
        activeSavedId ===
        item.id
      ) {

        activeSavedId =
          null;

      }


      persistSavedTexts();

      renderSavedTexts();

      closeContextMenu();


      showToast(
        "Saved text deleted."
      );

    }


    /* ========================================
       TOAST
       ======================================== */

    let toastTimer = null;


    function showToast(message) {

      clearTimeout(
        toastTimer
      );


      toast.textContent =
        message;


      toast.classList.add(
        "show"
      );


      toastTimer =
        setTimeout(
          () => {

            toast.classList.remove(
              "show"
            );

          },
          1800
        );

    }


    /* ========================================
       SIDEBAR
       ======================================== */

    function toggleSidebar() {

      sidebar.classList.toggle(
        "collapsed"
      );

    }


    /* ========================================
       WPM
       ======================================== */

    function getWpm() {

      let wpm =
        Number(
          wpmInput.value
        );


      if (
        !Number.isFinite(wpm)
      ) {

        wpm = 300;

      }


      return Math.max(
        1,
        Math.min(
          2500,
          wpm
        )
      );

    }


    function validateWpmInput() {

      let wpm =
        Number(
          wpmInput.value
        );


      if (
        !Number.isFinite(wpm) ||
        wpm < 1
      ) {

        wpm = 1;

      }


      if (
        wpm > 2500
      ) {

        wpm = 2500;

      }


      wpmInput.value =
        Math.round(wpm);


      updateProgress();

    }


    /* ========================================
       ORP
       ======================================== */

    function getPivotCharacterIndex(
      word
    ) {

      const characterPositions =
        [];


      for (
        let i = 0;
        i < word.length;
        i++
      ) {

        if (
          /[\p{L}\p{N}]/u.test(
            word[i]
          )
        ) {

          characterPositions.push(
            i
          );

        }

      }


      if (
        characterPositions.length === 0
      ) {

        return 0;

      }


      const length =
        characterPositions.length;


      let pivotPosition;


      if (length === 1) {

        pivotPosition = 0;

      } else if (
        length <= 5
      ) {

        pivotPosition = 1;

      } else if (
        length <= 9
      ) {

        pivotPosition = 2;

      } else if (
        length <= 13
      ) {

        pivotPosition = 3;

      } else {

        pivotPosition = 4;

      }


      pivotPosition =
        Math.min(
          pivotPosition,
          characterPositions.length - 1
        );


      return characterPositions[
        pivotPosition
      ];

    }


    /* ========================================
       WORD POSITION
       ======================================== */

    function positionWordOnPivot() {

      const pivotCenter =
        pivotElement.offsetLeft +
        (
          pivotElement.offsetWidth /
          2
        );


      wordElement.style.setProperty(
        "--pivot-shift",
        `${-pivotCenter}px`
      );

    }


    function displayWord(word) {

      if (!word) {
        return;
      }


      const pivotIndex =
        getPivotCharacterIndex(
          word
        );


      beforeElement.textContent =
        word.slice(
          0,
          pivotIndex
        );


      pivotElement.textContent =
        word[
          pivotIndex
        ];


      afterElement.textContent =
        word.slice(
          pivotIndex + 1
        );


      positionWordOnPivot();

    }


    /* ========================================
       TIME
       ======================================== */

    function getWordDuration() {

      return (
        60000 /
        getWpm()
      );

    }


    function getRemainingMilliseconds() {

      if (
        words.length === 0 ||
        !running
      ) {

        return 0;

      }


      const remainingWords =
        words.length -
        currentIndex;


      return (
        remainingWords *
        getWordDuration()
      );

    }


    function formatDuration(
      milliseconds
    ) {

      const totalSeconds =
        Math.max(
          0,
          Math.ceil(
            milliseconds /
            1000
          )
        );


      const hours =
        Math.floor(
          totalSeconds /
          3600
        );


      const minutes =
        Math.floor(
          (
            totalSeconds %
            3600
          ) /
          60
        );


      const seconds =
        totalSeconds %
        60;


      if (hours > 0) {

        return (
          `${hours}:` +
          `${String(minutes).padStart(
            2,
            "0"
          )}:` +
          `${String(seconds).padStart(
            2,
            "0"
          )}`
        );

      }


      return (
        `${minutes}:` +
        `${String(seconds).padStart(
          2,
          "0"
        )}`
      );

    }


    /* ========================================
       PROGRESS
       ======================================== */

    function updateProgress() {

      if (
        words.length === 0
      ) {

        progressSlider.value =
          0;


        progressSlider.style.setProperty(
          "--progress",
          "0%"
        );


        wordCounter.textContent =
          "0 / 0";


        percentage.textContent =
          "0%";


        timeRemaining.textContent =
          "Time remaining: 0:00";


        return;

      }


      let progress = 0;


      if (
        words.length > 1
      ) {

        progress =
          currentIndex /
          (
            words.length - 1
          );

      }


      progress =
        Math.max(
          0,
          Math.min(
            progress,
            1
          )
        );


      const progressPercent =
        progress * 100;


      progressSlider.value =
        currentIndex;


      progressSlider.style.setProperty(
        "--progress",
        `${progressPercent}%`
      );


      wordCounter.textContent =
        `${currentIndex + 1} / ${words.length}`;


      percentage.textContent =
        `${Math.round(
          progressPercent
        )}%`;


      timeRemaining.textContent =
        "Time remaining: " +
        formatDuration(
          getRemainingMilliseconds()
        );

    }


    /* ========================================
       PLAYBACK
       ======================================== */

    function showCurrentWord() {

      clearTimeout(timer);


      if (
        !running ||
        paused
      ) {

        return;

      }


      if (
        currentIndex >=
        words.length
      ) {

        finishReading();

        return;

      }


      displayWord(
        words[
          currentIndex
        ]
      );


      updateProgress();


      timer =
        setTimeout(
          () => {

            currentIndex++;


            if (
              currentIndex >=
              words.length
            ) {

              finishReading();

              return;

            }


            showCurrentWord();

          },
          getWordDuration()
        );

    }


    function startReading() {

      const text =
        textInput.value.trim();


      if (!text) {

        showToast(
          "Paste some text first."
        );

        return;

      }


      validateWpmInput();

      clearTimeout(timer);


      words =
        text.match(/\S+/g) ||
        [];


      if (
        words.length === 0
      ) {

        return;

      }


      currentIndex = 0;

      running = true;

      paused = false;


      progressSlider.min =
        0;


      progressSlider.max =
        Math.max(
          words.length - 1,
          0
        );


      progressSlider.value =
        0;


      progressSlider.disabled =
        false;


      pauseButton.disabled =
        false;


      restartButton.disabled =
        false;


      pauseButton.textContent =
        "Pause";


      showCurrentWord();

    }


    function togglePause() {

      if (!running) {
        return;
      }


      if (paused) {

        paused = false;

        pauseButton.textContent =
          "Pause";


        showCurrentWord();

      } else {

        paused = true;

        pauseButton.textContent =
          "Resume";


        clearTimeout(timer);

        updateProgress();

      }

    }


    function restartReading() {

      if (
        words.length === 0
      ) {

        return;

      }


      clearTimeout(timer);


      currentIndex = 0;

      running = true;

      paused = true;


      displayWord(
        words[0]
      );


      updateProgress();


      pauseButton.disabled =
        false;


      pauseButton.textContent =
        "Resume";


      restartButton.disabled =
        false;

    }


    function finishReading() {

      clearTimeout(timer);


      currentIndex =
        Math.max(
          words.length - 1,
          0
        );


      if (
        words.length > 0
      ) {

        displayWord(
          words[
            currentIndex
          ]
        );

      }


      running = false;

      paused = false;


      updateProgress();


      pauseButton.disabled =
        true;


      pauseButton.textContent =
        "Pause";

    }


    function seekToWord(index) {

      if (
        words.length === 0
      ) {

        return;

      }


      clearTimeout(timer);


      currentIndex =
        Math.max(
          0,
          Math.min(
            Number(index),
            words.length - 1
          )
        );


      displayWord(
        words[
          currentIndex
        ]
      );


      if (!running) {

        running = true;

        paused = true;


        pauseButton.disabled =
          false;


        pauseButton.textContent =
          "Resume";

      }


      updateProgress();


      if (!paused) {

        showCurrentWord();

      }

    }


    /* ========================================
       RESET READER
       ======================================== */

    function resetReader() {

      clearTimeout(timer);


      words = [];

      currentIndex = 0;

      running = false;

      paused = false;


      progressSlider.min =
        0;


      progressSlider.max =
        0;


      progressSlider.value =
        0;


      progressSlider.disabled =
        true;


      pauseButton.disabled =
        true;


      restartButton.disabled =
        true;


      pauseButton.textContent =
        "Pause";


      displayWord(
        "Ready"
      );


      updateProgress();

    }


    /* ========================================
       EVENTS
       ======================================== */

    sidebarToggle.addEventListener(
      "click",
      toggleSidebar
    );


    newTextButton.addEventListener(
      "click",
      newText
    );


    saveTextButton.addEventListener(
      "click",
      saveCurrentText
    );


    startButton.addEventListener(
      "click",
      startReading
    );


    pauseButton.addEventListener(
      "click",
      togglePause
    );


    restartButton.addEventListener(
      "click",
      restartReading
    );


    progressSlider.addEventListener(
      "input",
      () => {

        seekToWord(
          progressSlider.value
        );

      }
    );


    wpmInput.addEventListener(
      "input",
      updateProgress
    );


    wpmInput.addEventListener(
      "change",
      validateWpmInput
    );


    wpmInput.addEventListener(
      "blur",
      validateWpmInput
    );


    renameSavedButton.addEventListener(
      "click",
      renameSavedText
    );


    deleteSavedButton.addEventListener(
      "click",
      deleteSavedText
    );


    document.addEventListener(
      "click",
      event => {

        if (
          !contextMenu.contains(
            event.target
          ) &&
          !event.target.closest(
            ".saved-menu-button"
          )
        ) {

          closeContextMenu();

        }

      }
    );


    document.addEventListener(
      "keydown",
      event => {

        /*
         * Escape closes menus/sidebar.
         */

        if (
          event.key === "Escape"
        ) {

          closeContextMenu();

          return;

        }


        const editable =
          event.target.matches(
            "textarea, input, button"
          );


        if (editable) {
          return;
        }


        if (
          event.code === "Space"
        ) {

          event.preventDefault();


          if (running) {

            togglePause();

          }

        }

      }
    );


    /*
     * Mark the current saved item as modified
     * without automatically overwriting it.
     */

    textInput.addEventListener(
      "input",
      () => {

        if (activeSavedId) {

          saveTextButton.textContent =
            "Save changes";

        }

      }
    );


    saveTextButton.addEventListener(
      "click",
      () => {

        setTimeout(
          () => {

            saveTextButton.textContent =
              "Save";

          },
          100
        );

      }
    );


    /* ========================================
       INITIALIZE
       ======================================== */

    loadSavedTextsFromStorage();

    renderSavedTexts();

    resetReader();


    /*
     * Start collapsed on mobile.
     */

    if (
      window.innerWidth <= 760
    ) {

      sidebar.classList.add(
        "collapsed"
      );

    }

  </script>

</body>
</html>
