<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>RSVP Speed Reader</title>

  <style>
    /* =========================================================
       BASE
       ========================================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #090909;
      color: white;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }


    /* =========================================================
       APP LAYOUT
       ========================================================= */

    .app-shell {
      min-height: 100vh;

      display: flex;
    }

    .main-area {
      flex: 1;
      min-width: 0;

      position: relative;

      padding:
        44px
        32px
        72px;

      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 1080px;

      display: grid;

      gap: 26px;
    }


    /* =========================================================
       SIDEBAR
       ========================================================= */

    .sidebar {
      width: 290px;
      flex-shrink: 0;

      background: #111111;

      border-right:
        1px solid #242424;

      display: flex;
      flex-direction: column;

      transition:
        width 0.2s ease,
        transform 0.2s ease;
    }

    .sidebar.collapsed {
      width: 0;

      overflow: hidden;

      border-right: 0;
    }

    .sidebar-header {
      padding: 16px;

      border-bottom:
        1px solid #242424;
    }

    .new-text-button {
      width: 100%;

      border:
        1px solid #333;

      border-radius: 11px;

      background: #1d1d1d;
      color: white;

      padding: 13px 14px;

      cursor: pointer;

      text-align: left;

      font-weight: 600;
    }

    .new-text-button:hover {
      background: #292929;
    }

    .sidebar-section-title {
      padding:
        20px
        16px
        9px;

      color: #888;

      font-size: 12px;
      font-weight: 600;

      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .saved-list {
      flex: 1;

      overflow-y: auto;

      padding:
        4px
        8px
        18px;
    }

    .saved-empty {
      padding: 12px 9px;

      color: #666;

      font-size: 13px;
      line-height: 1.5;
    }

    .saved-item {
      position: relative;

      display: flex;
      align-items: center;

      width: 100%;

      margin-bottom: 3px;

      border-radius: 8px;

      background: transparent;
    }

    .saved-item.active {
      background: #242424;
    }

    .saved-title-button {
      flex: 1;
      min-width: 0;

      border: 0;

      background: transparent;
      color: #e9e9e9;

      cursor: pointer;

      text-align: left;

      padding:
        11px
        8px
        11px
        10px;

      overflow: hidden;

      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .saved-title-button:hover {
      background: #1c1c1c;

      border-radius: 8px;
    }

    .saved-item.active
    .saved-title-button:hover {
      background: #2a2a2a;
    }

    .saved-menu-button {
      flex-shrink: 0;

      width: 34px;
      height: 34px;

      border: 0;
      border-radius: 7px;

      background: transparent;
      color: #999;

      cursor: pointer;

      font-size: 20px;

      opacity: 0;
    }

    .saved-item:hover
    .saved-menu-button,
    .saved-item.active
    .saved-menu-button {
      opacity: 1;
    }

    .saved-menu-button:hover {
      background: #333;
      color: white;
    }


    /* =========================================================
       CONTEXT MENU
       ========================================================= */

    .context-menu {
      position: fixed;

      z-index: 100;

      width: 160px;

      padding: 6px;

      border:
        1px solid #333;

      border-radius: 10px;

      background: #1c1c1c;

      box-shadow:
        0
        12px
        35px
        rgba(0, 0, 0, 0.45);

      display: none;
    }

    .context-menu.open {
      display: block;
    }

    .context-menu button {
      width: 100%;

      border: 0;
      border-radius: 7px;

      background: transparent;
      color: white;

      padding: 10px;

      cursor: pointer;

      text-align: left;
    }

    .context-menu button:hover {
      background: #303030;
    }

    .context-menu .delete-option {
      color: #ff7979;
    }


    /* =========================================================
       TOP BAR
       ========================================================= */

    .top-bar {
      display: grid;

      grid-template-columns:
        auto
        1fr
        auto;

      align-items: center;

      gap: 18px;
    }

    .sidebar-toggle {
      width: 52px;
      height: 52px;

      flex-shrink: 0;

      border:
        1px solid #333;

      border-radius: 12px;

      background: #171717;
      color: white;

      cursor: pointer;

      font-size: 24px;
    }

    .sidebar-toggle:hover {
      background: #242424;
    }


    /* =========================================================
       FANCY TITLE
       ========================================================= */

    .page-title {
      margin: 0;

      text-align: center;

      font-size:
        clamp(
          34px,
          3.2vw,
          58px
        );

      font-weight: 700;

      line-height: 1.1;

      letter-spacing: 0.01em;
    }

    .title-word {
      display: inline-block;

      white-space: nowrap;
    }

    .title-pivot {
      color: #ff4141;
    }

    .title-space {
      display: inline-block;

      width: 0.45em;
    }

    .save-button {
      min-height: 52px;

      flex-shrink: 0;

      border:
        1px solid #3b3b3b;

      border-radius: 10px;

      background: #1b1b1b;
      color: white;

      padding:
        12px
        18px;

      cursor: pointer;

      font-weight: 600;
    }

    .save-button:hover {
      background: #282828;
    }


    /* =========================================================
       INPUT / CONTROLS
       ========================================================= */

    .controls {
      display: grid;

      gap: 18px;
    }

    textarea {
      width: 100%;

      min-height: 230px;

      resize: vertical;

      background: #161616;
      color: white;

      border:
        1px solid #333;

      border-radius: 12px;

      padding: 20px;

      font-size: 16px;

      line-height: 1.55;

      outline: none;
    }

    textarea:focus {
      border-color: #666;
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;

      gap: 14px;

      align-items: center;
    }

    .wpm-input {
      width: 120px;

      min-height: 48px;

      background: #161616;
      color: white;

      border:
        1px solid #333;

      border-radius: 10px;

      padding:
        12px
        14px;

      outline: none;
    }

    .wpm-input:focus {
      border-color: #777;
    }

    .control-button {
      min-height: 48px;

      border: 0;

      border-radius: 10px;

      padding:
        13px
        20px;

      cursor: pointer;

      font-weight: 600;

      background: white;
      color: black;
    }

    .control-button:hover {
      opacity: 0.88;
    }

    .control-button:disabled {
      opacity: 0.35;

      cursor: not-allowed;
    }


    /* =========================================================
       READER
       ========================================================= */

    .reader {
      position: relative;

      height: 310px;

      background: #0d0d0d;

      border:
        1px solid #222;

      border-radius: 16px;

      overflow: hidden;
    }

    .reader::before,
    .reader::after {
      content: "";

      position: absolute;

      left: 50%;

      width: 2px;
      height: 28px;

      background: #383838;

      transform:
        translateX(-50%);
    }

    .reader::before {
      top: 0;
    }

    .reader::after {
      bottom: 0;
    }


    /* =========================================================
       RSVP WORD
       ========================================================= */

    .word {
      position: absolute;

      left: 50%;
      top: 50%;

      display: inline-flex;

      align-items: baseline;

      white-space: pre;

      font-size:
        clamp(
          52px,
          8vw,
          104px
        );

      font-weight: 700;

      line-height: 1;

      transform:
        translate(
          var(
            --pivot-shift,
            0px
          ),
          -50%
        );
    }

    .before,
    .pivot,
    .after {
      display: inline;

      white-space: pre;
    }

    .pivot {
      color: #ff4141;
    }


    /* =========================================================
       PROGRESS
       ========================================================= */

    .progress-area {
      margin-top: 2px;
    }

    .progress-slider {
      --progress: 0%;

      width: 100%;
      height: 22px;

      margin: 0;
      padding: 0;

      appearance: none;
      -webkit-appearance: none;

      background: transparent;

      cursor: pointer;
    }


    /* Chrome / Edge / Safari */

    .progress-slider::-webkit-slider-runnable-track {
      height: 9px;

      border-radius: 999px;

      background:
        linear-gradient(
          to right,
          white 0%,
          white var(--progress),
          #222 var(--progress),
          #222 100%
        );
    }

    .progress-slider::-webkit-slider-thumb {
      -webkit-appearance: none;

      width: 20px;
      height: 20px;

      margin-top: -5.5px;

      border-radius: 50%;

      border:
        2px solid white;

      background: #090909;

      cursor: grab;
    }

    .progress-slider::-webkit-slider-thumb:active {
      cursor: grabbing;
    }


    /* Firefox */

    .progress-slider::-moz-range-track {
      height: 9px;

      border-radius: 999px;

      background: #222;
    }

    .progress-slider::-moz-range-progress {
      height: 9px;

      border-radius: 999px;

      background: white;
    }

    .progress-slider::-moz-range-thumb {
      width: 18px;
      height: 18px;

      border:
        2px solid white;

      border-radius: 50%;

      background: #090909;

      cursor: grab;
    }

    .progress-slider:disabled {
      opacity: 0.35;

      cursor: default;
    }

    .progress-info {
      display: flex;

      justify-content: space-between;
      align-items: flex-start;

      margin-top: 10px;

      font-size: 16px;

      color: #888;
    }

    .progress-right {
      display: flex;
      flex-direction: column;

      align-items: flex-end;

      gap: 7px;
    }

    .time-remaining {
      font-size: 14px;

      color: #666;
    }

    .hint {
      text-align: center;

      color: #666;

      font-size: 15px;

      margin-top: 6px;
    }


    /* =========================================================
       TOAST
       ========================================================= */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 24px;

      z-index: 200;

      transform:
        translateX(-50%)
        translateY(20px);

      background: #242424;
      color: white;

      border:
        1px solid #3a3a3a;

      border-radius: 9px;

      padding:
        10px
        14px;

      font-size: 14px;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    .toast.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 760px) {

      .sidebar {
        position: fixed;

        left: 0;
        top: 0;
        bottom: 0;

        z-index: 50;

        width: 290px;

        box-shadow:
          20px
          0
          40px
          rgba(0, 0, 0, 0.45);
      }

      .sidebar.collapsed {
        width: 290px;

        transform:
          translateX(-100%);

        border-right:
          1px solid #242424;
      }

      .main-area {
        padding:
          24px
          16px
          42px;
      }

      .app {
        gap: 20px;
      }

      .top-bar {
        gap: 10px;
      }

      .sidebar-toggle {
        width: 46px;
        height: 46px;

        font-size: 21px;
      }

      .save-button {
        min-height: 46px;

        padding:
          9px
          12px;
      }

      .page-title {
        font-size: 24px;
      }

      textarea {
        min-height: 180px;

        padding: 16px;
      }

      .reader {
        height: 230px;
      }

      .word {
        font-size:
          clamp(
            42px,
            12vw,
            72px
          );
      }

      .control-row {
        gap: 10px;
      }
    }


    @media (max-width: 480px) {

      .page-title {
        font-size: 19px;
      }

      .title-space {
        width: 0.3em;
      }

      .sidebar-toggle {
        width: 42px;
        height: 42px;
      }

      .save-button {
        min-height: 42px;

        padding:
          8px
          10px;

        font-size: 14px;
      }

      .reader {
        height: 210px;
      }
    }
  </style>
</head>


<body>

  <div class="app-shell">


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside
      class="sidebar"
      id="sidebar"
    >

      <div class="sidebar-header">

        <button
          class="new-text-button"
          id="newTextButton"
          type="button"
        >
          ＋ New text
        </button>

      </div>


      <div class="sidebar-section-title">
        Saved texts
      </div>


      <div
        class="saved-list"
        id="savedList"
      ></div>

    </aside>


    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main class="main-area">

      <div class="app">


        <!-- =================================================
             TOP BAR
             ================================================= -->

        <div class="top-bar">

          <button
            class="sidebar-toggle"
            id="sidebarToggle"
            type="button"
            aria-label="Toggle saved texts sidebar"
            title="Toggle saved texts"
          >
            ☰
          </button>


          <h1
            class="page-title"
            id="pageTitle"
            aria-label="RSVP Speed Reader"
          ></h1>


          <button
            class="save-button"
            id="saveTextButton"
            type="button"
          >
            Save
          </button>

        </div>


        <!-- =================================================
             TEXT INPUT AND CONTROLS
             ================================================= -->

        <section class="controls">

          <textarea
            id="textInput"
            placeholder="Paste the text you want to speed read here..."
          ></textarea>


          <div class="control-row">

            <label for="wpmInput">
              Speed:
            </label>


            <input
              id="wpmInput"
              class="wpm-input"
              type="number"
              value="300"
              min="1"
              max="2500"
              step="1"
              inputmode="numeric"
              aria-label="Words per minute"
            />


            <span>
              WPM
            </span>


            <button
              class="control-button"
              id="startButton"
              type="button"
            >
              Start
            </button>


            <button
              class="control-button"
              id="pauseButton"
              type="button"
              disabled
            >
              Pause
            </button>


            <button
              class="control-button"
              id="restartButton"
              type="button"
              disabled
            >
              Restart
            </button>

          </div>

        </section>


        <!-- =================================================
             RSVP READER
             ================================================= -->

        <section class="reader">

          <div
            class="word"
            id="word"
          >
            <span
              class="before"
              id="before"
            ></span><span
              class="pivot"
              id="pivot"
            >R</span><span
              class="after"
              id="after"
            >eady</span>
          </div>

        </section>


        <!-- =================================================
             PROGRESS
             ================================================= -->

        <section class="progress-area">

          <input
            id="progressSlider"
            class="progress-slider"
            type="range"
            min="0"
            max="0"
            value="0"
            step="1"
            aria-label="Reading progress"
            disabled
          />


          <div class="progress-info">

            <span id="wordCounter">
              0 / 0
            </span>


            <div class="progress-right">

              <span id="percentage">
                0%
              </span>


              <span
                class="time-remaining"
                id="timeRemaining"
              >
                Time remaining: 0:00
              </span>

            </div>

          </div>

        </section>


        <div class="hint">
          Press Space to pause/resume
        </div>

      </div>

    </main>

  </div>


  <!-- =======================================================
       SAVED TEXT CONTEXT MENU
       ======================================================= -->

  <div
    class="context-menu"
    id="contextMenu"
  >

    <button
      id="renameSavedButton"
      type="button"
    >
      Rename
    </button>


    <button
      class="delete-option"
      id="deleteSavedButton"
      type="button"
    >
      Delete
    </button>

  </div>


  <!-- =======================================================
       TOAST
       ======================================================= -->

  <div
    class="toast"
    id="toast"
    aria-live="polite"
  ></div>


  <script>

    /* =========================================================
       ELEMENTS
       ========================================================= */

    const sidebar =
      document.getElementById(
        "sidebar"
      );

    const sidebarToggle =
      document.getElementById(
        "sidebarToggle"
      );

    const newTextButton =
      document.getElementById(
        "newTextButton"
      );

    const saveTextButton =
      document.getElementById(
        "saveTextButton"
      );

    const savedList =
      document.getElementById(
        "savedList"
      );

    const contextMenu =
      document.getElementById(
        "contextMenu"
      );

    const renameSavedButton =
      document.getElementById(
        "renameSavedButton"
      );

    const deleteSavedButton =
      document.getElementById(
        "deleteSavedButton"
      );

    const toast =
      document.getElementById(
        "toast"
      );

    const pageTitle =
      document.getElementById(
        "pageTitle"
      );

    const textInput =
      document.getElementById(
        "textInput"
      );

    const wpmInput =
      document.getElementById(
        "wpmInput"
      );

    const startButton =
      document.getElementById(
        "startButton"
      );

    const pauseButton =
      document.getElementById(
        "pauseButton"
      );

    const restartButton =
      document.getElementById(
        "restartButton"
      );

    const wordElement =
      document.getElementById(
        "word"
      );

    const beforeElement =
      document.getElementById(
        "before"
      );

    const pivotElement =
      document.getElementById(
        "pivot"
      );

    const afterElement =
      document.getElementById(
        "after"
      );

    const progressSlider =
      document.getElementById(
        "progressSlider"
      );

    const wordCounter =
      document.getElementById(
        "wordCounter"
      );

    const percentage =
      document.getElementById(
        "percentage"
      );

    const timeRemaining =
      document.getElementById(
        "timeRemaining"
      );


    /* =========================================================
       STATE
       ========================================================= */

    const STORAGE_KEY =
      "rsvp_saved_texts_v1";


    let savedTexts = [];

    let activeSavedId = null;

    let contextMenuId = null;


    let words = [];

    let currentIndex = 0;

    let timer = null;

    let running = false;

    let paused = false;


    /* =========================================================
       RANDOM TITLE
       ========================================================= */

    function getRandomDisplayCharacterIndex(
      word
    ) {

      const validIndexes = [];


      for (
        let i = 0;
        i < word.length;
        i++
      ) {

        if (
          /[\p{L}\p{N}]/u.test(
            word[i]
          )
        ) {

          validIndexes.push(i);

        }

      }


      if (
        validIndexes.length === 0
      ) {

        return 0;

      }


      const randomPosition =
        Math.floor(
          Math.random() *
          validIndexes.length
        );


      return validIndexes[
        randomPosition
      ];

    }


    function renderFancyTitle() {

      const titleText =
        "RSVP Speed Reader";


      const titleWords =
        titleText.split(" ");


      pageTitle.innerHTML = "";


      titleWords.forEach(
        (
          titleWord,
          wordIndex
        ) => {

          const pivotIndex =
            getRandomDisplayCharacterIndex(
              titleWord
            );


          const wordSpan =
            document.createElement(
              "span"
            );


          wordSpan.className =
            "title-word";


          const beforeSpan =
            document.createElement(
              "span"
            );


          beforeSpan.textContent =
            titleWord.slice(
              0,
              pivotIndex
            );


          const pivotSpan =
            document.createElement(
              "span"
            );


          pivotSpan.className =
            "title-pivot";


          pivotSpan.textContent =
            titleWord[
              pivotIndex
            ];


          const afterSpan =
            document.createElement(
              "span"
            );


          afterSpan.textContent =
            titleWord.slice(
              pivotIndex + 1
            );


          wordSpan.append(
            beforeSpan,
            pivotSpan,
            afterSpan
          );


          pageTitle.appendChild(
            wordSpan
          );


          if (
            wordIndex <
            titleWords.length - 1
          ) {

            const spacer =
              document.createElement(
                "span"
              );


            spacer.className =
              "title-space";


            spacer.textContent =
              " ";


            pageTitle.appendChild(
              spacer
            );

          }

        }
      );

    }


    /* =========================================================
       STORAGE
       ========================================================= */

    function loadSavedTextsFromStorage() {

      try {

        const raw =
          localStorage.getItem(
            STORAGE_KEY
          );


        if (!raw) {

          savedTexts = [];

          return;

        }


        const parsed =
          JSON.parse(raw);


        savedTexts =
          Array.isArray(parsed)
            ? parsed
            : [];

      } catch (error) {

        console.error(
          "Could not load saved texts:",
          error
        );


        savedTexts = [];

      }

    }


    function persistSavedTexts() {

      try {

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(
            savedTexts
          )
        );

      } catch (error) {

        console.error(
          "Could not save texts:",
          error
        );


        showToast(
          "Could not save to browser storage."
        );

      }

    }


    /* =========================================================
       SAVED TEXT TITLE
       ========================================================= */

    function generateTitle(text) {

      const clean =
        text
          .replace(
            /\s+/g,
            " "
          )
          .trim();


      if (!clean) {

        return "Untitled text";

      }


      const textWords =
        clean.split(" ");


      let title =
        textWords
          .slice(0, 7)
          .join(" ");


      if (
        title.length > 45
      ) {

        title =
          title.slice(
            0,
            45
          );

      }


      if (
        clean.length >
        title.length
      ) {

        title += "…";

      }


      return title;

    }


    function createId() {

      if (
        window.crypto &&
        crypto.randomUUID
      ) {

        return crypto.randomUUID();

      }


      return (
        Date.now().toString(36) +
        Math
          .random()
          .toString(36)
          .slice(2)
      );

    }


    /* =========================================================
       SAVE
       ========================================================= */

    function saveCurrentText() {

      const text =
        textInput.value.trim();


      if (!text) {

        showToast(
          "Paste some text before saving."
        );

        return;

      }


      validateWpmInput();


      /*
       * Update existing saved text.
       */

      if (activeSavedId) {

        const existing =
          savedTexts.find(
            item =>
              item.id ===
              activeSavedId
          );


        if (existing) {

          existing.text =
            textInput.value;


          existing.wpm =
            getWpm();


          existing.updatedAt =
            Date.now();


          persistSavedTexts();

          renderSavedTexts();


          saveTextButton.textContent =
            "Save";


          showToast(
            "Saved changes."
          );


          return;

        }

      }


      /*
       * Create new saved text.
       */

      const item = {

        id:
          createId(),

        title:
          generateTitle(text),

        text:
          textInput.value,

        wpm:
          getWpm(),

        createdAt:
          Date.now(),

        updatedAt:
          Date.now()

      };


      savedTexts.unshift(
        item
      );


      activeSavedId =
        item.id;


      persistSavedTexts();

      renderSavedTexts();


      saveTextButton.textContent =
        "Save";


      showToast(
        "Text saved."
      );

    }


    /* =========================================================
       RENDER SAVED TEXTS
       ========================================================= */

    function renderSavedTexts() {

      savedList.innerHTML = "";


      if (
        savedTexts.length === 0
      ) {

        const empty =
          document.createElement(
            "div"
          );


        empty.className =
          "saved-empty";


        empty.textContent =
          "Your saved texts will appear here.";


        savedList.appendChild(
          empty
        );


        return;

      }


      const sorted =
        [...savedTexts].sort(
          (
            a,
            b
          ) =>
            (b.updatedAt || 0) -
            (a.updatedAt || 0)
        );


      sorted.forEach(
        item => {

          const row =
            document.createElement(
              "div"
            );


          row.className =
            "saved-item";


          if (
            item.id ===
            activeSavedId
          ) {

            row.classList.add(
              "active"
            );

          }


          const titleButton =
            document.createElement(
              "button"
            );


          titleButton.type =
            "button";


          titleButton.className =
            "saved-title-button";


          titleButton.textContent =
            item.title;


          titleButton.title =
            item.title;


          titleButton.addEventListener(
            "click",
            () => {

              loadSavedText(
                item.id
              );

            }
          );


          const menuButton =
            document.createElement(
              "button"
            );


          menuButton.type =
            "button";


          menuButton.className =
            "saved-menu-button";


          menuButton.textContent =
            "⋯";


          menuButton.setAttribute(
            "aria-label",
            `Options for ${item.title}`
          );


          menuButton.addEventListener(
            "click",
            event => {

              event.stopPropagation();


              openContextMenu(
                item.id,
                menuButton
              );

            }
          );


          row.append(
            titleButton,
            menuButton
          );


          savedList.appendChild(
            row
          );

        }
      );

    }


    /* =========================================================
       LOAD SAVED TEXT
       ========================================================= */

    function loadSavedText(id) {

      const item =
        savedTexts.find(
          saved =>
            saved.id === id
        );


      if (!item) {
        return;
      }


      activeSavedId =
        item.id;


      textInput.value =
        item.text;


      wpmInput.value =
        item.wpm || 300;


      saveTextButton.textContent =
        "Save";


      resetReader();

      renderSavedTexts();


      if (
        window.innerWidth <=
        760
      ) {

        sidebar.classList.add(
          "collapsed"
        );

      }

    }


    /* =========================================================
       NEW TEXT
       ========================================================= */

    function newText() {

      clearTimeout(timer);


      activeSavedId =
        null;


      textInput.value =
        "";


      wpmInput.value =
        300;


      saveTextButton.textContent =
        "Save";


      resetReader();

      renderSavedTexts();


      textInput.focus();


      if (
        window.innerWidth <=
        760
      ) {

        sidebar.classList.add(
          "collapsed"
        );

      }

    }


    /* =========================================================
       CONTEXT MENU
       ========================================================= */

    function openContextMenu(
      id,
      button
    ) {

      contextMenuId =
        id;


      const rect =
        button.getBoundingClientRect();


      const menuWidth =
        160;


      const left =
        Math.min(
          window.innerWidth -
          menuWidth -
          8,

          Math.max(
            8,
            rect.right -
            menuWidth
          )
        );


      const top =
        Math.min(
          window.innerHeight -
          100,

          rect.bottom +
          4
        );


      contextMenu.style.left =
        `${left}px`;


      contextMenu.style.top =
        `${top}px`;


      contextMenu.classList.add(
        "open"
      );

    }


    function closeContextMenu() {

      contextMenu.classList.remove(
        "open"
      );


      contextMenuId =
        null;

    }


    function renameSavedText() {

      if (!contextMenuId) {
        return;
      }


      const id =
        contextMenuId;


      const item =
        savedTexts.find(
          saved =>
            saved.id === id
        );


      if (!item) {

        closeContextMenu();

        return;

      }


      const newTitle =
        prompt(
          "Rename saved text:",
          item.title
        );


      if (
        newTitle === null
      ) {

        closeContextMenu();

        return;

      }


      const clean =
        newTitle.trim();


      if (!clean) {

        closeContextMenu();

        return;

      }


      item.title =
        clean;


      item.updatedAt =
        Date.now();


      persistSavedTexts();

      renderSavedTexts();

      closeContextMenu();

    }


    function deleteSavedText() {

      if (!contextMenuId) {
        return;
      }


      const id =
        contextMenuId;


      const item =
        savedTexts.find(
          saved =>
            saved.id === id
        );


      if (!item) {

        closeContextMenu();

        return;

      }


      const confirmed =
        confirm(
          `Delete "${item.title}"?`
        );


      if (!confirmed) {

        closeContextMenu();

        return;

      }


      savedTexts =
        savedTexts.filter(
          saved =>
            saved.id !== id
        );


      if (
        activeSavedId === id
      ) {

        activeSavedId =
          null;


        saveTextButton.textContent =
          "Save";

      }


      persistSavedTexts();

      renderSavedTexts();

      closeContextMenu();


      showToast(
        "Saved text deleted."
      );

    }


    /* =========================================================
       TOAST
       ========================================================= */

    let toastTimer =
      null;


    function showToast(
      message
    ) {

      clearTimeout(
        toastTimer
      );


      toast.textContent =
        message;


      toast.classList.add(
        "show"
      );


      toastTimer =
        setTimeout(
          () => {

            toast.classList.remove(
              "show"
            );

          },
          1800
        );

    }


    /* =========================================================
       SIDEBAR
       ========================================================= */

    function toggleSidebar() {

      sidebar.classList.toggle(
        "collapsed"
      );

    }


    /* =========================================================
       WPM
       ========================================================= */

    function getWpm() {

      let wpm =
        Number(
          wpmInput.value
        );


      if (
        !Number.isFinite(wpm)
      ) {

        wpm = 300;

      }


      return Math.max(
        1,
        Math.min(
          2500,
          wpm
        )
      );

    }


    function validateWpmInput() {

      let wpm =
        Number(
          wpmInput.value
        );


      if (
        !Number.isFinite(wpm) ||
        wpm < 1
      ) {

        wpm = 1;

      }


      if (
        wpm > 2500
      ) {

        wpm = 2500;

      }


      wpm =
        Math.round(wpm);


      wpmInput.value =
        wpm;


      updateProgress();

    }


    /* =========================================================
       ORP / RED FOCUS LETTER
       ========================================================= */

    function getPivotCharacterIndex(
      word
    ) {

      const characterPositions =
        [];


      /*
       * Ignore punctuation when deciding
       * which character should be red.
       */

      for (
        let i = 0;
        i < word.length;
        i++
      ) {

        if (
          /[\p{L}\p{N}]/u.test(
            word[i]
          )
        ) {

          characterPositions.push(
            i
          );

        }

      }


      if (
        characterPositions.length ===
        0
      ) {

        return 0;

      }


      const length =
        characterPositions.length;


      let pivotPosition;


      if (
        length === 1
      ) {

        pivotPosition = 0;

      } else if (
        length <= 5
      ) {

        pivotPosition = 1;

      } else if (
        length <= 9
      ) {

        pivotPosition = 2;

      } else if (
        length <= 13
      ) {

        pivotPosition = 3;

      } else {

        pivotPosition = 4;

      }


      pivotPosition =
        Math.min(
          pivotPosition,
          characterPositions.length -
          1
        );


      return characterPositions[
        pivotPosition
      ];

    }


    /* =========================================================
       WORD POSITIONING
       ========================================================= */

    function positionWordOnPivot() {

      const pivotCenter =
        pivotElement.offsetLeft +
        (
          pivotElement.offsetWidth /
          2
        );


      wordElement.style.setProperty(
        "--pivot-shift",
        `${-pivotCenter}px`
      );

    }


    function displayWord(
      word
    ) {

      if (!word) {
        return;
      }


      const pivotIndex =
        getPivotCharacterIndex(
          word
        );


      beforeElement.textContent =
        word.slice(
          0,
          pivotIndex
        );


      pivotElement.textContent =
        word[
          pivotIndex
        ];


      afterElement.textContent =
        word.slice(
          pivotIndex + 1
        );


      positionWordOnPivot();

    }


    /* =========================================================
       TIMING
       ========================================================= */

    function getWordDuration() {

      return (
        60000 /
        getWpm()
      );

    }


    function getRemainingMilliseconds() {

      if (
        words.length === 0 ||
        !running
      ) {

        return 0;

      }


      const remainingWords =
        Math.max(
          0,
          words.length -
          currentIndex
        );


      return (
        remainingWords *
        getWordDuration()
      );

    }


    function formatDuration(
      milliseconds
    ) {

      const totalSeconds =
        Math.max(
          0,
          Math.ceil(
            milliseconds /
            1000
          )
        );


      const hours =
        Math.floor(
          totalSeconds /
          3600
        );


      const minutes =
        Math.floor(
          (
            totalSeconds %
            3600
          ) /
          60
        );


      const seconds =
        totalSeconds %
        60;


      if (
        hours > 0
      ) {

        return (
          `${hours}:` +
          `${String(minutes).padStart(
            2,
            "0"
          )}:` +
          `${String(seconds).padStart(
            2,
            "0"
          )}`
        );

      }


      return (
        `${minutes}:` +
        `${String(seconds).padStart(
          2,
          "0"
        )}`
      );

    }


    /* =========================================================
       PROGRESS
       ========================================================= */

    function updateProgress() {

      if (
        words.length === 0
      ) {

        progressSlider.value =
          0;


        progressSlider.style.setProperty(
          "--progress",
          "0%"
        );


        wordCounter.textContent =
          "0 / 0";


        percentage.textContent =
          "0%";


        timeRemaining.textContent =
          "Time remaining: 0:00";


        return;

      }


      let progress = 0;


      if (
        words.length > 1
      ) {

        progress =
          currentIndex /
          (
            words.length -
            1
          );

      }


      progress =
        Math.max(
          0,
          Math.min(
            progress,
            1
          )
        );


      const progressPercent =
        progress *
        100;


      progressSlider.value =
        currentIndex;


      progressSlider.style.setProperty(
        "--progress",
        `${progressPercent}%`
      );


      wordCounter.textContent =
        `${currentIndex + 1} / ${words.length}`;


      percentage.textContent =
        `${Math.round(
          progressPercent
        )}%`;


      timeRemaining.textContent =
        "Time remaining: " +
        formatDuration(
          getRemainingMilliseconds()
        );

    }


    /* =========================================================
       PLAYBACK
       ========================================================= */

    function showCurrentWord() {

      clearTimeout(timer);


      if (
        !running ||
        paused
      ) {

        return;

      }


      if (
        currentIndex >=
        words.length
      ) {

        finishReading();

        return;

      }


      displayWord(
        words[
          currentIndex
        ]
      );


      updateProgress();


      timer =
        setTimeout(
          () => {

            currentIndex++;


            if (
              currentIndex >=
              words.length
            ) {

              finishReading();

              return;

            }


            showCurrentWord();

          },

          getWordDuration()
        );

    }


    /* =========================================================
       START
       ========================================================= */

    function startReading() {

      const text =
        textInput.value.trim();


      if (!text) {

        showToast(
          "Paste some text first."
        );

        return;

      }


      validateWpmInput();


      clearTimeout(timer);


      words =
        text.match(
          /\S+/g
        ) || [];


      if (
        words.length === 0
      ) {

        return;

      }


      currentIndex =
        0;


      running =
        true;


      paused =
        false;


      progressSlider.min =
        0;


      progressSlider.max =
        Math.max(
          words.length -
          1,
          0
        );


      progressSlider.value =
        0;


      progressSlider.disabled =
        false;


      pauseButton.disabled =
        false;


      restartButton.disabled =
        false;


      pauseButton.textContent =
        "Pause";


      showCurrentWord();

    }


    /* =========================================================
       PAUSE / RESUME
       ========================================================= */

    function togglePause() {

      if (!running) {
        return;
      }


      if (paused) {

        paused =
          false;


        pauseButton.textContent =
          "Pause";


        showCurrentWord();

      } else {

        paused =
          true;


        pauseButton.textContent =
          "Resume";


        clearTimeout(timer);


        updateProgress();

      }

    }


    /* =========================================================
       RESTART
       ========================================================= */

    function restartReading() {

      if (
        words.length === 0
      ) {

        return;

      }


      clearTimeout(timer);


      currentIndex =
        0;


      /*
       * Restart at the beginning,
       * but stay paused.
       */

      running =
        true;


      paused =
        true;


      displayWord(
        words[0]
      );


      updateProgress();


      pauseButton.disabled =
        false;


      pauseButton.textContent =
        "Resume";


      restartButton.disabled =
        false;

    }


    /* =========================================================
       FINISH
       ========================================================= */

    function finishReading() {

      clearTimeout(timer);


      currentIndex =
        Math.max(
          words.length -
          1,
          0
        );


      if (
        words.length > 0
      ) {

        displayWord(
          words[
            currentIndex
          ]
        );

      }


      running =
        false;


      paused =
        false;


      updateProgress();


      pauseButton.disabled =
        true;


      pauseButton.textContent =
        "Pause";

    }


    /* =========================================================
       SEEK
       ========================================================= */

    function seekToWord(
      index
    ) {

      if (
        words.length === 0
      ) {

        return;

      }


      clearTimeout(timer);


      currentIndex =
        Math.max(
          0,
          Math.min(
            Number(index),
            words.length -
            1
          )
        );


      displayWord(
        words[
          currentIndex
        ]
      );


      /*
       * If the reader had finished,
       * seeking makes it resumable
       * in a paused state.
       */

      if (!running) {

        running =
          true;


        paused =
          true;


        pauseButton.disabled =
          false;


        pauseButton.textContent =
          "Resume";

      }


      updateProgress();


      /*
       * If already playing,
       * continue from new position.
       */

      if (!paused) {

        showCurrentWord();

      }

    }


    /* =========================================================
       RESET READER
       ========================================================= */

    function resetReader() {

      clearTimeout(timer);


      words =
        [];


      currentIndex =
        0;


      running =
        false;


      paused =
        false;


      progressSlider.min =
        0;


      progressSlider.max =
        0;


      progressSlider.value =
        0;


      progressSlider.disabled =
        true;


      pauseButton.disabled =
        true;


      restartButton.disabled =
        true;


      pauseButton.textContent =
        "Pause";


      /*
       * Uses normal RSVP positioning so
       * "Ready" remains joined together.
       */

      displayWord(
        "Ready"
      );


      updateProgress();

    }


    /* =========================================================
       EVENTS
       ========================================================= */

    sidebarToggle.addEventListener(
      "click",
      toggleSidebar
    );


    newTextButton.addEventListener(
      "click",
      newText
    );


    saveTextButton.addEventListener(
      "click",
      saveCurrentText
    );


    startButton.addEventListener(
      "click",
      startReading
    );


    pauseButton.addEventListener(
      "click",
      togglePause
    );


    restartButton.addEventListener(
      "click",
      restartReading
    );


    progressSlider.addEventListener(
      "input",
      () => {

        seekToWord(
          progressSlider.value
        );

      }
    );


    /*
     * Changing WPM updates the
     * time estimate immediately.
     */

    wpmInput.addEventListener(
      "input",
      () => {

        updateProgress();

      }
    );


    wpmInput.addEventListener(
      "change",
      validateWpmInput
    );


    wpmInput.addEventListener(
      "blur",
      validateWpmInput
    );


    renameSavedButton.addEventListener(
      "click",
      renameSavedText
    );


    deleteSavedButton.addEventListener(
      "click",
      deleteSavedText
    );


    /*
     * Mark loaded text as changed.
     */

    textInput.addEventListener(
      "input",
      () => {

        if (
          activeSavedId
        ) {

          saveTextButton.textContent =
            "Save changes";

        }

      }
    );


    /*
     * Changing WPM also counts as
     * changing a saved item.
     */

    wpmInput.addEventListener(
      "input",
      () => {

        if (
          activeSavedId
        ) {

          saveTextButton.textContent =
            "Save changes";

        }

      }
    );


    /*
     * Click outside context menu
     * closes it.
     */

    document.addEventListener(
      "click",
      event => {

        if (
          !contextMenu.contains(
            event.target
          ) &&
          !event.target.closest(
            ".saved-menu-button"
          )
        ) {

          closeContextMenu();

        }

      }
    );


    /*
     * Keyboard shortcuts.
     */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Escape"
        ) {

          closeContextMenu();

          return;

        }


        const editable =
          event.target.matches(
            "textarea, input, button"
          );


        if (editable) {
          return;
        }


        if (
          event.code ===
          "Space"
        ) {

          event.preventDefault();


          if (running) {

            togglePause();

          }

        }

      }
    );


    /*
     * Recalculate RSVP position after
     * the browser window changes size.
     */

    window.addEventListener(
      "resize",
      () => {

        positionWordOnPivot();

      }
    );


    /* =========================================================
       INITIALIZE
       ========================================================= */

    loadSavedTextsFromStorage();

    renderSavedTexts();

    renderFancyTitle();

    resetReader();


    /*
     * Mobile starts with sidebar closed.
     */

    if (
      window.innerWidth <=
      760
    ) {

      sidebar.classList.add(
        "collapsed"
      );

    }

  </script>

</body>
</html>
