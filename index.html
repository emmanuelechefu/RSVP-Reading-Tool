<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSVP Speed Reader</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #090909;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 850px;
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
    }

    .controls {
      display: grid;
      gap: 14px;
      margin-bottom: 24px;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      background: #161616;
      color: white;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 16px;
      font-size: 16px;
      line-height: 1.5;
      outline: none;
    }

    textarea:focus {
      border-color: #666;
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    select,
    button {
      font: inherit;
    }

    select {
      background: #161616;
      color: white;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px 14px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 18px;
      cursor: pointer;
      font-weight: 600;
      background: white;
      color: black;
    }

    button:hover {
      opacity: 0.88;
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .reader {
      position: relative;
      height: 250px;
      background: #0d0d0d;
      border: 1px solid #222;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .reader::before,
    .reader::after {
      content: "";
      position: absolute;
      left: 50%;
      width: 2px;
      height: 22px;
      background: #383838;
      transform: translateX(-50%);
    }

    .reader::before {
      top: 0;
    }

    .reader::after {
      bottom: 0;
    }

    .word {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: baseline;
      font-size: clamp(36px, 8vw, 76px);
      font-weight: 600;
      line-height: 1;
      padding: 0 24px;
    }

    .before {
      text-align: right;
      white-space: pre;
    }

    .pivot {
      color: #ff4141;
      white-space: pre;
    }

    .after {
      text-align: left;
      white-space: pre;
    }

    /* =========================
       INTERACTIVE PROGRESS BAR
       ========================= */

    .progress-area {
      margin-top: 18px;
    }

    .progress-slider {
      --progress: 0%;

      width: 100%;
      height: 18px;
      margin: 0;
      padding: 0;

      appearance: none;
      -webkit-appearance: none;

      background: transparent;
      cursor: pointer;
    }

    /* Chrome / Edge / Safari */
    .progress-slider::-webkit-slider-runnable-track {
      height: 8px;
      border-radius: 999px;
      background:
        linear-gradient(
          to right,
          white 0%,
          white var(--progress),
          #222 var(--progress),
          #222 100%
        );
    }

    .progress-slider::-webkit-slider-thumb {
      -webkit-appearance: none;

      width: 18px;
      height: 18px;

      margin-top: -5px;

      border-radius: 50%;
      border: 2px solid white;

      background: #090909;

      cursor: grab;
    }

    .progress-slider::-webkit-slider-thumb:active {
      cursor: grabbing;
      transform: scale(1.15);
    }

    /* Firefox */
    .progress-slider::-moz-range-track {
      height: 8px;
      border-radius: 999px;
      background: #222;
    }

    .progress-slider::-moz-range-progress {
      height: 8px;
      border-radius: 999px;
      background: white;
    }

    .progress-slider::-moz-range-thumb {
      width: 16px;
      height: 16px;

      border: 2px solid white;
      border-radius: 50%;

      background: #090909;
      cursor: grab;
    }

    .progress-slider:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
      font-size: 14px;
      color: #888;
    }

    .hint {
      text-align: center;
      color: #666;
      font-size: 13px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <main class="app">

    <h1>RSVP Speed Reader</h1>

    <section class="controls">

      <textarea
        id="textInput"
        placeholder="Paste the text you want to speed read here..."
      ></textarea>

      <div class="control-row">

        <label for="wpmSelect">
          Speed:
        </label>

        <select id="wpmSelect">
          <option value="100">100 WPM</option>
          <option value="150">150 WPM</option>
          <option value="200">200 WPM</option>
          <option value="250">250 WPM</option>
          <option value="300" selected>300 WPM</option>
          <option value="350">350 WPM</option>
          <option value="400">400 WPM</option>
          <option value="450">450 WPM</option>
          <option value="500">500 WPM</option>
          <option value="600">600 WPM</option>
          <option value="700">700 WPM</option>
          <option value="800">800 WPM</option>
          <option value="900">900 WPM</option>
          <option value="1000">1000 WPM</option>
        </select>

        <button id="startButton">
          Start
        </button>

        <button
          id="pauseButton"
          disabled
        >
          Pause
        </button>

        <button
          id="restartButton"
          disabled
        >
          Restart
        </button>

      </div>

    </section>


    <section class="reader">

      <div class="word">

        <span
          class="before"
          id="before"
        ></span>

        <span
          class="pivot"
          id="pivot"
        >
          R
        </span>

        <span
          class="after"
          id="after"
        >
          eady
        </span>

      </div>

    </section>


    <section class="progress-area">

      <input
        id="progressSlider"
        class="progress-slider"
        type="range"
        min="0"
        max="0"
        value="0"
        step="1"
        aria-label="Reading progress"
        disabled
      />

      <div class="progress-info">

        <span id="wordCounter">
          0 / 0
        </span>

        <span id="percentage">
          0%
        </span>

      </div>

    </section>


    <div class="hint">
      Press Space to pause/resume
    </div>

  </main>


  <script>

    /* =========================
       ELEMENTS
       ========================= */

    const textInput =
      document.getElementById("textInput");

    const wpmSelect =
      document.getElementById("wpmSelect");

    const startButton =
      document.getElementById("startButton");

    const pauseButton =
      document.getElementById("pauseButton");

    const restartButton =
      document.getElementById("restartButton");

    const beforeElement =
      document.getElementById("before");

    const pivotElement =
      document.getElementById("pivot");

    const afterElement =
      document.getElementById("after");

    const progressSlider =
      document.getElementById("progressSlider");

    const wordCounter =
      document.getElementById("wordCounter");

    const percentage =
      document.getElementById("percentage");


    /* =========================
       STATE
       ========================= */

    let words = [];

    let currentIndex = 0;

    let timer = null;

    let running = false;

    let paused = false;


    /* =========================
       ORP / RED LETTER
       ========================= */

    function getPivotCharacterIndex(word) {

      const characterPositions = [];

      /*
       * Ignore punctuation when determining
       * which letter should be the pivot.
       */

      for (let i = 0; i < word.length; i++) {

        if (/[\p{L}\p{N}]/u.test(word[i])) {
          characterPositions.push(i);
        }

      }


      if (characterPositions.length === 0) {
        return 0;
      }


      const length =
        characterPositions.length;

      let pivotPosition;


      if (length === 1) {

        pivotPosition = 0;

      } else if (length <= 5) {

        pivotPosition = 1;

      } else if (length <= 9) {

        pivotPosition = 2;

      } else if (length <= 13) {

        pivotPosition = 3;

      } else {

        pivotPosition = 4;

      }


      pivotPosition =
        Math.min(
          pivotPosition,
          characterPositions.length - 1
        );


      return characterPositions[pivotPosition];

    }


    /* =========================
       DISPLAY WORD
       ========================= */

    function displayWord(word) {

      if (!word) {
        return;
      }


      const pivotIndex =
        getPivotCharacterIndex(word);


      beforeElement.textContent =
        word.slice(0, pivotIndex);

      pivotElement.textContent =
        word[pivotIndex];

      afterElement.textContent =
        word.slice(pivotIndex + 1);

    }


    /* =========================
       PROGRESS
       ========================= */

    function updateProgress() {

      if (words.length === 0) {

        progressSlider.value = 0;

        progressSlider.style.setProperty(
          "--progress",
          "0%"
        );

        wordCounter.textContent =
          "0 / 0";

        percentage.textContent =
          "0%";

        return;

      }


      /*
       * Index 0 = 0%
       * Last index = 100%
       */

      let progress = 0;


      if (words.length > 1) {

        progress =
          currentIndex /
          (words.length - 1);

      }


      progress =
        Math.max(
          0,
          Math.min(progress, 1)
        );


      const progressPercent =
        progress * 100;


      progressSlider.value =
        currentIndex;


      progressSlider.style.setProperty(
        "--progress",
        `${progressPercent}%`
      );


      wordCounter.textContent =
        `${currentIndex + 1} / ${words.length}`;


      percentage.textContent =
        `${Math.round(progressPercent)}%`;

    }


    /* =========================
       TIMING
       ========================= */

    function getWordDuration() {

      const wpm =
        Number(wpmSelect.value);

      return 60000 / wpm;

    }


    /* =========================
       PLAYBACK
       ========================= */

    function showCurrentWord() {

      clearTimeout(timer);


      if (!running || paused) {
        return;
      }


      if (currentIndex >= words.length) {

        finishReading();

        return;

      }


      displayWord(
        words[currentIndex]
      );

      updateProgress();


      timer = setTimeout(() => {

        currentIndex++;


        if (currentIndex >= words.length) {

          finishReading();

          return;

        }


        showCurrentWord();

      }, getWordDuration());

    }


    /* =========================
       START
       ========================= */

    function startReading() {

      const text =
        textInput.value.trim();


      if (!text) {

        alert(
          "Paste some text first."
        );

        return;

      }


      clearTimeout(timer);


      words =
        text.match(/\S+/g) || [];


      if (words.length === 0) {
        return;
      }


      currentIndex = 0;

      running = true;

      paused = false;


      progressSlider.min = 0;

      progressSlider.max =
        Math.max(
          words.length - 1,
          0
        );

      progressSlider.value = 0;

      progressSlider.disabled = false;


      pauseButton.disabled = false;

      restartButton.disabled = false;

      pauseButton.textContent =
        "Pause";


      showCurrentWord();

    }


    /* =========================
       PAUSE / RESUME
       ========================= */

    function togglePause() {

      if (!running) {
        return;
      }


      if (paused) {

        paused = false;

        pauseButton.textContent =
          "Pause";

        showCurrentWord();

      } else {

        paused = true;

        pauseButton.textContent =
          "Resume";

        clearTimeout(timer);

      }

    }


    /* =========================
       RESTART
       ========================= */

    function restartReading() {

      if (words.length === 0) {
        return;
      }


      clearTimeout(timer);


      /*
       * Reset to first word.
       */

      currentIndex = 0;


      /*
       * Reader still exists,
       * but is now PAUSED.
       */

      running = true;

      paused = true;


      displayWord(
        words[currentIndex]
      );


      updateProgress();


      pauseButton.disabled = false;

      pauseButton.textContent =
        "Resume";


      restartButton.disabled = false;

    }


    /* =========================
       FINISH
       ========================= */

    function finishReading() {

      clearTimeout(timer);


      currentIndex =
        Math.max(
          words.length - 1,
          0
        );


      /*
       * Keep the final word visible.
       */

      if (words.length > 0) {

        displayWord(
          words[currentIndex]
        );

      }


      updateProgress();


      running = false;

      paused = false;


      pauseButton.disabled = true;

      pauseButton.textContent =
        "Pause";

    }


    /* =========================
       SEEK / SKIP
       ========================= */

    function seekToWord(index) {

      if (words.length === 0) {
        return;
      }


      /*
       * Stop the existing timer so an
       * old timeout can't advance us
       * after the seek.
       */

      clearTimeout(timer);


      currentIndex =
        Math.max(
          0,
          Math.min(
            Number(index),
            words.length - 1
          )
        );


      displayWord(
        words[currentIndex]
      );


      updateProgress();


      /*
       * If playback had already finished
       * and the user seeks backwards,
       * put the reader into a paused state
       * so they can press Resume.
       */

      if (!running) {

        running = true;

        paused = true;

        pauseButton.disabled = false;

        pauseButton.textContent =
          "Resume";

        return;

      }


      /*
       * If currently playing,
       * continue from the new location.
       *
       * If currently paused,
       * simply stay paused.
       */

      if (!paused) {

        showCurrentWord();

      }

    }


    /* =========================
       EVENTS
       ========================= */

    startButton.addEventListener(
      "click",
      startReading
    );


    pauseButton.addEventListener(
      "click",
      togglePause
    );


    restartButton.addEventListener(
      "click",
      restartReading
    );


    /*
     * "input" fires continuously while
     * dragging the progress slider.
     */

    progressSlider.addEventListener(
      "input",
      () => {

        seekToWord(
          progressSlider.value
        );

      }
    );


    /*
     * Space bar pause / resume.
     *
     * Don't intercept Space while
     * typing into the textarea,
     * using the select, etc.
     */

    document.addEventListener(
      "keydown",
      event => {

        const editable =
          event.target.matches(
            "textarea, input, select, button"
          );


        if (editable) {
          return;
        }


        if (event.code === "Space") {

          event.preventDefault();


          if (running) {

            togglePause();

          }

        }

      }
    );

  </script>

</body>
</html>
