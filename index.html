<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>RSVP Speed Reader</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family: Arial, Helvetica, sans-serif;

      background: #090909;
      color: white;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 850px;
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
    }

    /* =========================
       CONTROLS
       ========================= */

    .controls {
      display: grid;
      gap: 14px;

      margin-bottom: 24px;
    }

    textarea {
      width: 100%;
      min-height: 180px;

      resize: vertical;

      background: #161616;
      color: white;

      border: 1px solid #333;
      border-radius: 10px;

      padding: 16px;

      font-size: 16px;
      line-height: 1.5;

      outline: none;
    }

    textarea:focus {
      border-color: #666;
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;

      gap: 12px;

      align-items: center;
    }

    button,
    input {
      font: inherit;
    }

    /* =========================
       WPM INPUT
       ========================= */

    .wpm-input {
      width: 110px;

      background: #161616;
      color: white;

      border: 1px solid #333;
      border-radius: 8px;

      padding: 10px 12px;

      outline: none;
    }

    .wpm-input:focus {
      border-color: #777;
    }

    /* =========================
       BUTTONS
       ========================= */

    button {
      border: 0;
      border-radius: 8px;

      padding: 11px 18px;

      cursor: pointer;

      font-weight: 600;

      background: white;
      color: black;
    }

    button:hover {
      opacity: 0.88;
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* =========================
       READER
       ========================= */

    .reader {
      position: relative;

      height: 250px;

      background: #0d0d0d;

      border: 1px solid #222;
      border-radius: 14px;

      overflow: hidden;
    }

    /*
      Top and bottom indicators showing
      the exact eye fixation point.
    */

    .reader::before,
    .reader::after {
      content: "";

      position: absolute;

      left: 50%;

      width: 2px;
      height: 22px;

      background: #383838;

      transform: translateX(-50%);
    }

    .reader::before {
      top: 0;
    }

    .reader::after {
      bottom: 0;
    }

    /* =========================
       WORD POSITIONING
       ========================= */

    /*
      The word is rendered as ONE continuous
      inline-flex item.

      JavaScript measures where the red pivot
      letter is and moves the entire word so
      that the centre of that letter sits at 50%.

      This fixes the "R     eady" spacing issue.
    */

    .word {
      position: absolute;

      left: 50%;
      top: 50%;

      display: inline-flex;
      align-items: baseline;

      white-space: pre;

      font-size: clamp(36px, 8vw, 76px);
      font-weight: 600;
      line-height: 1;

      /*
        JavaScript adds the horizontal
        translation dynamically.
      */

      transform:
        translate(
          var(--pivot-shift, 0px),
          -50%
        );
    }

    .before,
    .pivot,
    .after {
      display: inline;
      white-space: pre;
    }

    .pivot {
      color: #ff4141;
    }

    /* =========================
       PROGRESS
       ========================= */

    .progress-area {
      margin-top: 18px;
    }

    .progress-slider {
      --progress: 0%;

      width: 100%;
      height: 18px;

      margin: 0;
      padding: 0;

      appearance: none;
      -webkit-appearance: none;

      background: transparent;

      cursor: pointer;
    }

    /* Chrome / Safari / Edge */

    .progress-slider::-webkit-slider-runnable-track {
      height: 8px;

      border-radius: 999px;

      background:
        linear-gradient(
          to right,
          white 0%,
          white var(--progress),
          #222 var(--progress),
          #222 100%
        );
    }

    .progress-slider::-webkit-slider-thumb {
      -webkit-appearance: none;

      width: 18px;
      height: 18px;

      margin-top: -5px;

      border-radius: 50%;

      border: 2px solid white;

      background: #090909;

      cursor: grab;
    }

    .progress-slider::-webkit-slider-thumb:active {
      cursor: grabbing;
    }

    /* Firefox */

    .progress-slider::-moz-range-track {
      height: 8px;

      border-radius: 999px;

      background: #222;
    }

    .progress-slider::-moz-range-progress {
      height: 8px;

      border-radius: 999px;

      background: white;
    }

    .progress-slider::-moz-range-thumb {
      width: 16px;
      height: 16px;

      border: 2px solid white;
      border-radius: 50%;

      background: #090909;

      cursor: grab;
    }

    .progress-slider:disabled {
      opacity: 0.35;
      cursor: default;
    }

    /* =========================
       PROGRESS INFORMATION
       ========================= */

    .progress-info {
      display: flex;

      justify-content: space-between;
      align-items: flex-start;

      margin-top: 5px;

      font-size: 14px;

      color: #888;
    }

    .progress-right {
      display: flex;
      flex-direction: column;

      align-items: flex-end;

      gap: 5px;
    }

    .time-remaining {
      font-size: 12px;
      color: #666;
    }

    .hint {
      text-align: center;

      color: #666;

      font-size: 13px;

      margin-top: 15px;
    }
  </style>
</head>

<body>

  <main class="app">

    <h1>RSVP Speed Reader</h1>


    <!-- =========================
         INPUT
         ========================= -->

    <section class="controls">

      <textarea
        id="textInput"
        placeholder="Paste the text you want to speed read here..."
      ></textarea>


      <div class="control-row">

        <label for="wpmInput">
          Speed:
        </label>


        <input
          id="wpmInput"
          class="wpm-input"
          type="number"
          value="300"
          min="1"
          max="2500"
          step="1"
          inputmode="numeric"
          aria-label="Words per minute"
        />


        <span>
          WPM
        </span>


        <button id="startButton">
          Start
        </button>


        <button
          id="pauseButton"
          disabled
        >
          Pause
        </button>


        <button
          id="restartButton"
          disabled
        >
          Restart
        </button>

      </div>

    </section>


    <!-- =========================
         READER
         ========================= -->

    <section class="reader">

      <div
        class="word"
        id="word"
      >

        <span
          class="before"
          id="before"
        ></span><span
          class="pivot"
          id="pivot"
        >R</span><span
          class="after"
          id="after"
        >eady</span>

      </div>

    </section>


    <!-- =========================
         PROGRESS
         ========================= -->

    <section class="progress-area">

      <input
        id="progressSlider"
        class="progress-slider"
        type="range"
        min="0"
        max="0"
        value="0"
        step="1"
        aria-label="Reading progress"
        disabled
      />


      <div class="progress-info">

        <span id="wordCounter">
          0 / 0
        </span>


        <div class="progress-right">

          <span id="percentage">
            0%
          </span>

          <span
            class="time-remaining"
            id="timeRemaining"
          >
            Time remaining: 0:00
          </span>

        </div>

      </div>

    </section>


    <div class="hint">
      Press Space to pause/resume
    </div>

  </main>


  <script>

    /* =========================
       ELEMENTS
       ========================= */

    const textInput =
      document.getElementById("textInput");

    const wpmInput =
      document.getElementById("wpmInput");

    const startButton =
      document.getElementById("startButton");

    const pauseButton =
      document.getElementById("pauseButton");

    const restartButton =
      document.getElementById("restartButton");

    const wordElement =
      document.getElementById("word");

    const beforeElement =
      document.getElementById("before");

    const pivotElement =
      document.getElementById("pivot");

    const afterElement =
      document.getElementById("after");

    const progressSlider =
      document.getElementById("progressSlider");

    const wordCounter =
      document.getElementById("wordCounter");

    const percentage =
      document.getElementById("percentage");

    const timeRemaining =
      document.getElementById("timeRemaining");


    /* =========================
       STATE
       ========================= */

    let words = [];

    let currentIndex = 0;

    let timer = null;

    let running = false;

    let paused = false;


    /* =========================
       WPM
       ========================= */

    function getWpm() {

      let wpm =
        Number(wpmInput.value);


      if (!Number.isFinite(wpm)) {
        wpm = 300;
      }


      return Math.max(
        1,
        Math.min(
          2500,
          wpm
        )
      );

    }


    function validateWpmInput() {

      let wpm =
        Number(wpmInput.value);


      if (!Number.isFinite(wpm) || wpm < 1) {
        wpm = 1;
      }


      if (wpm > 2500) {
        wpm = 2500;
      }


      wpmInput.value =
        Math.round(wpm);


      updateProgress();

    }


    /* =========================
       ORP / RED LETTER
       ========================= */

    function getPivotCharacterIndex(word) {

      const characterPositions = [];


      /*
       * Ignore punctuation when determining
       * the recognition point.
       */

      for (
        let i = 0;
        i < word.length;
        i++
      ) {

        if (
          /[\p{L}\p{N}]/u.test(
            word[i]
          )
        ) {

          characterPositions.push(i);

        }

      }


      if (
        characterPositions.length === 0
      ) {

        return 0;

      }


      const length =
        characterPositions.length;


      let pivotPosition;


      if (length === 1) {

        pivotPosition = 0;

      } else if (length <= 5) {

        pivotPosition = 1;

      } else if (length <= 9) {

        pivotPosition = 2;

      } else if (length <= 13) {

        pivotPosition = 3;

      } else {

        pivotPosition = 4;

      }


      pivotPosition =
        Math.min(
          pivotPosition,
          characterPositions.length - 1
        );


      return characterPositions[
        pivotPosition
      ];

    }


    /* =========================
       PIVOT POSITION
       ========================= */

    function positionWordOnPivot() {

      /*
       * Because .word begins at left: 50%,
       * determine how far the centre of the
       * pivot letter is from the beginning
       * of the word.
       */

      const pivotCenter =
        pivotElement.offsetLeft +
        (
          pivotElement.offsetWidth / 2
        );


      /*
       * Shift the complete word left by
       * that exact amount.
       */

      wordElement.style.setProperty(
        "--pivot-shift",
        `${-pivotCenter}px`
      );

    }


    /* =========================
       DISPLAY WORD
       ========================= */

    function displayWord(word) {

      if (!word) {
        return;
      }


      const pivotIndex =
        getPivotCharacterIndex(word);


      beforeElement.textContent =
        word.slice(
          0,
          pivotIndex
        );


      pivotElement.textContent =
        word[pivotIndex];


      afterElement.textContent =
        word.slice(
          pivotIndex + 1
        );


      /*
       * Reading offsetLeft forces the browser
       * to calculate the new text layout.
       */

      positionWordOnPivot();

    }


    /* =========================
       WORD DURATION
       ========================= */

    function getWordDuration() {

      return 60000 / getWpm();

    }


    /* =========================
       TIME REMAINING
       ========================= */

    function getRemainingMilliseconds() {

      if (words.length === 0) {
        return 0;
      }


      /*
       * Finished reading.
       */

      if (!running) {
        return 0;
      }


      /*
       * Include the word currently
       * being displayed.
       */

      const remainingWords =
        words.length - currentIndex;


      return (
        remainingWords *
        getWordDuration()
      );

    }


    function formatDuration(milliseconds) {

      /*
       * Round upward so something like
       * 3.2 seconds displays as 0:04,
       * rather than prematurely showing 0:03.
       */

      const totalSeconds =
        Math.max(
          0,
          Math.ceil(
            milliseconds / 1000
          )
        );


      const minutes =
        Math.floor(
          totalSeconds / 60
        );


      const seconds =
        totalSeconds % 60;


      return (
        `${minutes}:` +
        `${String(seconds).padStart(2, "0")}`
      );

    }


    /* =========================
       PROGRESS
       ========================= */

    function updateProgress() {

      if (words.length === 0) {

        progressSlider.value = 0;


        progressSlider.style.setProperty(
          "--progress",
          "0%"
        );


        wordCounter.textContent =
          "0 / 0";


        percentage.textContent =
          "0%";


        timeRemaining.textContent =
          "Time remaining: 0:00";


        return;

      }


      let progress = 0;


      if (words.length > 1) {

        progress =
          currentIndex /
          (words.length - 1);

      }


      progress =
        Math.max(
          0,
          Math.min(
            progress,
            1
          )
        );


      const progressPercent =
        progress * 100;


      progressSlider.value =
        currentIndex;


      progressSlider.style.setProperty(
        "--progress",
        `${progressPercent}%`
      );


      wordCounter.textContent =
        `${currentIndex + 1} / ${words.length}`;


      percentage.textContent =
        `${Math.round(progressPercent)}%`;


      timeRemaining.textContent =
        "Time remaining: " +
        formatDuration(
          getRemainingMilliseconds()
        );

    }


    /* =========================
       PLAYBACK
       ========================= */

    function showCurrentWord() {

      clearTimeout(timer);


      if (
        !running ||
        paused
      ) {

        return;

      }


      if (
        currentIndex >=
        words.length
      ) {

        finishReading();

        return;

      }


      displayWord(
        words[currentIndex]
      );


      updateProgress();


      timer =
        setTimeout(
          () => {

            currentIndex++;


            if (
              currentIndex >=
              words.length
            ) {

              finishReading();

              return;

            }


            showCurrentWord();

          },

          getWordDuration()
        );

    }


    /* =========================
       START
       ========================= */

    function startReading() {

      const text =
        textInput.value.trim();


      if (!text) {

        alert(
          "Paste some text first."
        );

        return;

      }


      validateWpmInput();


      clearTimeout(timer);


      words =
        text.match(/\S+/g) || [];


      if (
        words.length === 0
      ) {

        return;

      }


      currentIndex = 0;

      running = true;

      paused = false;


      progressSlider.min = 0;

      progressSlider.max =
        Math.max(
          words.length - 1,
          0
        );

      progressSlider.value = 0;

      progressSlider.disabled =
        false;


      pauseButton.disabled =
        false;

      restartButton.disabled =
        false;

      pauseButton.textContent =
        "Pause";


      showCurrentWord();

    }


    /* =========================
       PAUSE / RESUME
       ========================= */

    function togglePause() {

      if (!running) {
        return;
      }


      if (paused) {

        paused = false;

        pauseButton.textContent =
          "Pause";


        showCurrentWord();

      } else {

        paused = true;

        pauseButton.textContent =
          "Resume";


        clearTimeout(timer);

        updateProgress();

      }

    }


    /* =========================
       RESTART
       ========================= */

    function restartReading() {

      if (
        words.length === 0
      ) {

        return;

      }


      clearTimeout(timer);


      currentIndex = 0;


      /*
       * Reset to beginning,
       * but remain paused.
       */

      running = true;

      paused = true;


      displayWord(
        words[currentIndex]
      );


      updateProgress();


      pauseButton.disabled =
        false;

      pauseButton.textContent =
        "Resume";


      restartButton.disabled =
        false;

    }


    /* =========================
       FINISH
       ========================= */

    function finishReading() {

      clearTimeout(timer);


      currentIndex =
        Math.max(
          words.length - 1,
          0
        );


      if (
        words.length > 0
      ) {

        displayWord(
          words[currentIndex]
        );

      }


      running = false;

      paused = false;


      updateProgress();


      pauseButton.disabled =
        true;

      pauseButton.textContent =
        "Pause";

    }


    /* =========================
       SEEK
       ========================= */

    function seekToWord(index) {

      if (
        words.length === 0
      ) {

        return;

      }


      clearTimeout(timer);


      currentIndex =
        Math.max(
          0,
          Math.min(
            Number(index),
            words.length - 1
          )
        );


      displayWord(
        words[currentIndex]
      );


      /*
       * Seeking backward after the reader
       * finished should make it resumable.
       */

      if (!running) {

        running = true;

        paused = true;


        pauseButton.disabled =
          false;

        pauseButton.textContent =
          "Resume";

      }


      updateProgress();


      /*
       * Continue immediately if the reader
       * was already playing.
       */

      if (!paused) {

        showCurrentWord();

      }

    }


    /* =========================
       EVENTS
       ========================= */

    startButton.addEventListener(
      "click",
      startReading
    );


    pauseButton.addEventListener(
      "click",
      togglePause
    );


    restartButton.addEventListener(
      "click",
      restartReading
    );


    progressSlider.addEventListener(
      "input",
      () => {

        seekToWord(
          progressSlider.value
        );

      }
    );


    /*
     * Update the time estimate immediately
     * when WPM is edited.
     */

    wpmInput.addEventListener(
      "input",
      () => {

        updateProgress();

      }
    );


    /*
     * Enforce 1–2500 WPM once the user
     * commits/leaves the field.
     */

    wpmInput.addEventListener(
      "change",
      validateWpmInput
    );


    wpmInput.addEventListener(
      "blur",
      validateWpmInput
    );


    /*
     * Spacebar pause / resume.
     */

    document.addEventListener(
      "keydown",
      event => {

        const editable =
          event.target.matches(
            "textarea, input, button"
          );


        if (editable) {
          return;
        }


        if (
          event.code === "Space"
        ) {

          event.preventDefault();


          if (running) {

            togglePause();

          }

        }

      }
    );


    /* =========================
       INITIAL READY WORD
       ========================= */

    /*
     * Run it through the same positioning
     * system as normal RSVP words.

     * This specifically fixes:
     *
     * R       eady
     *
     * and renders:
     *
     * Ready
     */

    displayWord("Ready");

  </script>

</body>
</html>
